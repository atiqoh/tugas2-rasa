# =============================================================================
# endpoints.yml
# =============================================================================

# Custom actions dijalankan langsung di dalam proses Rasa Pro (tanpa `rasa run actions`).
# Jika versi Rasa Anda tidak mendukung `actions_module`, ganti dengan baris `url`
# lalu jalankan action server terpisah:  rasa run actions --port 5055
action_endpoint:
  actions_module: "actions"
  # url: "http://localhost:5055/webhook"

# NLU eksternal: Rasa (RasaNLUHttpInterpreter) akan POST ke {url}/model/parse
# untuk SETIAP pesan pengguna, termasuk payload tombol seperti "/check_stock".
nlu:
  url: "http://localhost:3000"

