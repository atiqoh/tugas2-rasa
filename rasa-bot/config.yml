# =============================================================================
# config.yml - Chatbot admin OlshopKu (Rasa Pro 3.x, mode NLU-based / stories+rules)
# =============================================================================
# Arsitektur NLU EKSTERNAL:
#   * Teks pengguna TIDAK diproses oleh pipeline NLU internal Rasa (tidak ada
#     WhitespaceTokenizer / CountVectorsFeaturizer / DIETClassifier).
#   * Rasa meneruskan teks ke NLU service (Flask + IndoBERT) yang alamatnya diatur di
#     endpoints.yml -> nlu.url. Service itu mengembalikan intent, confidence, entities.
#   * Karena tidak ada data NLU di proyek ini, `rasa train` otomatis hanya melatih model
#     dialog (Core) -> sesuai syarat dokumentasi Rasa untuk server NLU eksternal.
#
# NLUCommandAdapter:
#   Pada Rasa Pro, komponen ini memetakan intent hasil classifier ke perintah
#   StartFlow untuk flows (CALM) yang memiliki `nlu_trigger`. Komponen ini TIDAK
#   memiliki parameter koneksi HTTP. Parameter `url` di bawah dipertahankan agar konsisten
#   dengan modul kuliah, tetapi alamat yang benar-benar dipakai Rasa adalah
#   endpoints.yml -> nlu.url. Jika versi Rasa Anda menolak parameter yang tidak dikenal,
#   hapus baris `url` (lihat README bagian Troubleshooting).
# =============================================================================
recipe: default.v1
language: id

pipeline:
  - name: NLUCommandAdapter
    url: "http://localhost:3000"

policies:
  # Mengingat percakapan yang persis sama dengan stories.yml
  - name: MemoizationPolicy
    max_history: 5
  # Aturan deterministik (rules.yml), aktivasi/penutupan form, dan fallback dialog
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: "action_default_fallback"
    enable_fallback_prediction: true
  # Kebijakan ML (transformer) yang menggeneralisasi dari stories.yml
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true

assistant_id: olshopku-admin-bot
